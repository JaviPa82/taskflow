<ul>

  @for (tarea of tareas(); track tarea.id) {

    <app-task-item
        [tarea]="tarea"
        (completadaClick)= " onCompletada($event) "
        (eliminarClick)= " eliminarTarea($event) "
        (modificarClick) = " editarTarea($event) ">
    </app-task-item>

  }

</ul>
<ul>

  @for (tarea of papelera(); track tarea.id) {

    <app-task-papelera
        [tarea]="tarea"
        (restaurarClick) = " restaurarTarea($event) "
        (eliminarDefinitivoClick) = " eliminarDefinitivamente($event) ">
    </app-task-papelera>

  }

</ul>
