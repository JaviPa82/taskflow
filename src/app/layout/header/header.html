<h1>🚀 TaskFlow</h1>

<p>Gestión moderna de tareas</p>
@if (authService.authenticated()) {
  <a routerLink="/todas">
    Todas
  </a>
  <br>
  <a routerLink="/pendientes">
    Pendientes
  </a>
  <br>
  <a routerLink="/completadas">
    Completadas
  </a>
  <br>
  <a routerLink="/estadisticas">
    Estadísticas
  </a>
  <br>
  <a routerLink="/api-tasks">
    API Tasks
  </a>
  <br>
  <a routerLink="/api-statistics">
    API Statistics
  </a>
  <hr>

  <button
    (click)="logout()">

    Logout

  </button>
} @else {
  <a routerLink="/login">
    Login
  </a>
}
