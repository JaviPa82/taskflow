<app-header />

<input
  type="text"
  [value]="nuevaTarea()"
  (input)="actualizarTexto($event)"
  placeholder="Nueva tarea">

<button (click)="onGuardarEdicion()">
  Guardar edición
</button>

<button (click)="onAgregarTarea()">
  Añadir tarea
</button>

<app-task-list
  [tareas]="taskService.tareas()"
  [papelera]="taskService.papelera()"
  (completadaClick)="onToggleCompletada($event)"
  (eliminarClick)="onEliminarTarea($event)"
  (modificarClick)="onEditarTareaSeleccionada($event)"
  (restaurarClick) = " onRestaurarTarea($event) "
  (eliminarDefinitivoClick) = " onEliminarDefinitivamente($event) ">
</app-task-list>

<app-footer
  [pendientes]="pendientes()"
  [completadas]="completadas()">
</app-footer>
<p>Papelera: {{ taskService.totalPapelera() }}</p>
